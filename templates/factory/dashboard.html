<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#6b7482;--bd:#dde1e8;--pass:#1a7f4b;--chg:#c0392b;--pend:#9aa3b0;--warn:#b7791f;--acc:#3b5bdb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151b;--card:#1a1f28;--fg:#e6e9ef;--mut:#8f98a8;--bd:#2a313d;--pass:#4cc38a;--chg:#ef6b5e;--pend:#5d6676;--warn:#e0a84a;--acc:#7c93f5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px}
#meta{color:var(--mut);font-size:12px}
.wrap{padding:0 16px 16px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.panel.alert{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 30%,transparent)}
/* run banner */
.run{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.state{font-weight:600;padding:2px 10px;border-radius:99px;color:#fff;background:var(--pend)}
.state.running{background:var(--acc)}.state.done{background:var(--pass)}.state.stopped{background:var(--warn)}
.stat{font-size:12px;color:var(--mut)}.stat b{display:block;font-size:18px;color:var(--fg)}
.bar{flex:1 1 200px;min-width:160px}
.track{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .d{background:var(--pass)}.track .a{background:var(--acc)}.track .p{background:var(--warn)}
.reason{margin-top:8px;font-size:13px}
/* two-column row */
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
details{border-top:1px solid var(--bd);padding:6px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
details pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font:12px/1.4 ui-monospace,monospace}
/* backlog */
.item{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--bd);font-size:13px}
.item:first-of-type{border-top:0}
.item .t{flex:1}
.pill{font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;background:var(--pend);white-space:nowrap}
.pill.done{background:var(--pass)}.pill.active{background:var(--acc)}.pill.ready{background:var(--mut)}
.pill.parked{background:var(--warn)}.pill.blocked{background:var(--chg)}
.dep{font-size:11px;color:var(--mut)}
.ep{display:flex;gap:8px;align-items:center;font-size:12px;margin:4px 0}.ep span:first-child{width:36px}.ep .track{flex:1}.ep span:last-child{width:44px;text-align:right;color:var(--mut)}
/* kanban */
main{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:12px;overflow-x:auto}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}
.card.nh{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 30%,transparent)}
.card b{display:block;margin-bottom:4px}
.badge{font-size:11px;padding:1px 6px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.round{margin-top:6px;font-size:11px;color:var(--mut)}
.chip{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin:2px 2px 0 0;color:#fff;background:var(--pend)}
.chip.PASS{background:var(--pass)}.chip.CHANGES{background:var(--chg)}
#viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);padding:16px;overflow:auto}
#viewer .box{background:var(--card);max-width:860px;margin:0 auto;border-radius:8px;padding:16px}
#viewer pre{white-space:pre-wrap;word-break:break-word}
#viewer button{margin:0 4px 8px 0;cursor:pointer}
#viewer button.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--card))}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:8px}
.vbar .fname{font:12px ui-monospace,monospace;color:var(--mut)}
/* rendered markdown */
.md{font-size:14px;line-height:1.55;overflow-wrap:break-word}
.md p.id{margin:.35em 0}
.md h1,.md h2,.md h3,.md h4{line-height:1.25;margin:1.1em 0 .4em}
.md h1{font-size:20px}.md h2{font-size:17px;border-bottom:1px solid var(--bd);padding-bottom:4px}.md h3{font-size:15px}.md h4{font-size:14px}
.md>:first-child{margin-top:0}
.md p{margin:.5em 0}
.md ul,.md ol{margin:.4em 0;padding-left:1.5em}.md li{margin:.15em 0}
.md li.task{list-style:none;margin-left:-1.2em}
.md code{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:0 4px}
.md pre{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre;font:12px/1.45 ui-monospace,monospace}
.md pre code{background:none;border:0;padding:0}
.md blockquote{margin:.5em 0;padding:2px 10px;border-left:3px solid var(--bd);color:var(--mut)}
.md hr{border:0;border-top:1px solid var(--bd);margin:1em 0}
.md .tw{overflow-x:auto;margin:.5em 0}
.md table{border-collapse:collapse;font-size:13px}
.md th,.md td{border:1px solid var(--bd);padding:4px 8px;text-align:left;vertical-align:top}
.md th{background:var(--bg)}
.md a{color:var(--acc)}
.verdict{display:inline-block;font-weight:600;font-size:13px;padding:2px 10px;border-radius:99px;color:#fff;background:var(--pend);margin-bottom:6px}
.verdict.ok{background:var(--pass)}.verdict.bad{background:var(--chg)}.verdict.warn{background:var(--warn)}
.diff{font:12px/1.45 ui-monospace,monospace;white-space:pre;overflow-x:auto;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px 0}
.diff span{display:block;padding:0 10px}
.diff .a{background:color-mix(in srgb,var(--pass) 16%,transparent)}.diff .r{background:color-mix(in srgb,var(--chg) 16%,transparent)}
.diff .h{color:var(--acc)}.diff .f{font-weight:600;border-top:1px solid var(--bd);margin-top:6px;padding-top:4px}
.empty{color:var(--mut);font-size:12px}
.entry{border-top:1px solid var(--bd);padding:10px 0}.entry:first-of-type{border-top:0}
.eh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.why{margin:6px 0;color:var(--mut)}
.q{margin:8px 0}.qt{font-weight:600;margin-bottom:4px}.opts{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;min-height:32px}
button:disabled{opacity:.5;cursor:not-allowed}
button.prim{background:var(--acc);border-color:var(--acc);color:#fff}
button.opt.rec{border-color:var(--acc)}button.opt.sel{background:color-mix(in srgb,var(--acc) 18%,var(--card));border-color:var(--acc)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--acc)}button.prim .tag{color:#fff}
textarea,input.cmd{width:100%;margin:8px 0 0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.confirm,.queued,.msg{margin-top:8px;padding:8px;border-radius:6px;background:var(--bg);border:1px solid var(--bd)}
code{font:12px ui-monospace,monospace}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0 0 12px}.kv dt{color:var(--mut,#888)}.kv dd{margin:0;overflow-wrap:anywhere}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;max-height:340px;overflow:auto;margin:8px 0 0}
table.ev{border-collapse:collapse;width:100%;font-size:12px}table.ev td{border-top:1px solid var(--bd);padding:3px 6px;vertical-align:top}
</style>
</head>
<body>
<header><h1>Software Factory</h1><span id="meta"></span></header>
<div class="wrap">
  <div id="run" class="panel"></div>
  <div id="inbox"></div>
  <div class="row">
    <div class="panel"><h2 class="sec">Backlog queue</h2><div id="backlog"></div></div>
    <div class="panel"><h2 class="sec">Epics</h2><div id="epics"></div><div id="ctxwrap" style="display:none"><h2 class="sec" style="margin-top:14px">Contexts</h2><div id="ctxs"></div></div></div>
  </div>
  <div class="panel"><h2 class="sec">Health</h2><div id="health"></div></div>
  <h2 class="sec">Jobs</h2>
  <main id="board"></main>
</div>
<div id="viewer"><div class="box"><div id="tabs"></div><div id="content"></div><div class="vbar"><span class="fname" id="fname"></span><span><button id="rawbtn" onclick="toggleRaw()">Show source</button><button onclick="viewer.style.display='none'">Close</button></span></div></div></div>
<script>
const STAGES=["spec","build","verify","review","triage","decision","needs-human","done","cancelled"];
const REV=["security","ux","ui","code","architecture"];
const FILES=(j)=>["spec.md","build.md","verify.md","branch.diff","decision.md",...Object.keys(j.reviews||{}).flatMap(n=>[...REV.filter(r=>r in (j.reviews[n]||{})).map(r=>`round-${n}/${r}.md`),`round-${n}/triage.md`])];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const txt=async p=>{try{const r=await fetch(p+"?"+Date.now());return r.ok?await r.text():""}catch(e){return ""}};

/* Backlog line: "- [ ] B3 [E2] Title (depends: B1, B2)". B<n> is optional; falls back to position. */
function parseBacklog(md){
  const items=[];
  md.split("\n").forEach(l=>{
    const m=l.match(/^\s*-\s*\[([ xX])\]\s*(.*)$/); if(!m) return;
    let t=m[2], key=null, epic=null, ctx=null, deps=[];
    const k=t.match(/^(B\d+)\b[:.\s-]*/i); if(k){key=k[1].toUpperCase(); t=t.slice(k[0].length)}
    const e=t.match(/\[(E\d+)\]/i); if(e){epic=e[1].toUpperCase(); t=t.replace(e[0],"").trim()}
    const c=t.match(/\[ctx:([A-Za-z0-9_-]+)\]/i); if(c){ctx=c[1]; t=t.replace(c[0],"").trim()}
    const d=t.match(/\(?depends:\s*([^)]*)\)?/i); if(d){deps=d[1].split(/[,\s]+/).filter(Boolean).map(x=>x.toUpperCase()); t=t.replace(d[0],"").trim()}
    items.push({key:key||"B"+(items.length+1),epic,ctx,deps,title:t,checked:m[1]!==" "});
  });
  return items;
}
function classify(items,jobs){
  const byItem={}; jobs.forEach(j=>{if(j.item) byItem[String(j.item).toUpperCase()]=j});
  const done=new Set(items.filter(i=>i.checked).map(i=>i.key));
  jobs.forEach(j=>{if(j.stage==="done"&&j.item) done.add(String(j.item).toUpperCase())});
  items.forEach(i=>{
    const j=byItem[i.key]; i.job=j||null;
    const open=i.deps.filter(d=>!done.has(d));
    if(done.has(i.key)) i.status="done";
    else if(j&&j.stage==="needs-human") i.status="parked";
    else if(j) i.status="active";
    else if(open.length){
      const parked=open.some(d=>byItem[d]&&byItem[d].stage==="needs-human");
      i.status=parked?"blocked":"waiting"; i.open=open;
    } else i.status="ready";
  });
  return items;
}
function renderRun(b,items,jobs){
  const run=b.run||null;
  const total=items.length, nDone=items.filter(i=>i.status==="done").length;
  const nAct=items.filter(i=>i.status==="active").length;
  const parked=jobs.filter(j=>j.stage==="needs-human");
  const blocked=items.filter(i=>i.status==="blocked").length;
  const pc=n=>total?(100*n/total).toFixed(1):0;
  const status=run?run.status:(nAct?"running":"idle");
  const stat=(l,v)=>`<div class="stat">${l}<b>${esc(v)}</b></div>`;
  let h=`<div class="run"><span class="state ${esc(status)}">${esc(status)}</span>
    ${stat("Done",nDone+" / "+total)}${stat("In flight",nAct)}${stat("Parked",parked.length)}${stat("Blocked by parked",blocked)}
    ${run?stat("Consecutive failures",run.consecutive_failures??0):""}
    <div class="bar"><div class="track"><i class="d" style="width:${pc(nDone)}%"></i><i class="a" style="width:${pc(nAct)}%"></i><i class="p" style="width:${pc(parked.length)}%"></i></div></div></div>`;
  const plan=b.plan&&b.plan.status!=="done"?b.plan:null;
  if(run&&run.stop_reason) h+=`<div class="reason"><b>Stopped:</b> ${esc(run.stop_reason)}</div>`;
  else if(plan) h+=`<div class="reason empty"><b>Planning${plan.feature?" "+esc(plan.feature):""}:</b> pass ${esc(plan.pass)} of 3 (${esc(String(plan.status).replace(/-/g," "))}). Continue with /factory plan.</div>`;
  else if(!run&&!total) h+=`<div class="reason empty">No backlog yet. Run /factory plan.</div>`;
  else if(status==="idle"&&total) h+=`<div class="reason empty">No run active. Start one with /factory run.</div>`;
  h+=runExtras(run);$("run").innerHTML=h;
  $("run").classList.toggle("alert",status==="stopped");
}
/* ---- Human actions: inbox.json entries, option buttons, queue (server) or copy (read-only) ---- */
const CMD="/software-factory:factory";
let BOARD={},JOBS=[],ITEMS=[],ENTRIES=null,MD="",PENDING=[],APPLIED=[],VERIFY={},SERVER=false,TOKEN=null,lastSig="";
const UI={sel:{},note:{},confirm:{},msg:{},cmd:{}};
try{
  const m=location.hash.match(/t=([\w-]+)/);
  if(m){sessionStorage.setItem("factory-token",m[1]);try{localStorage.setItem("factory-token",m[1])}catch(e){}history.replaceState(null,"",location.pathname+location.search)}
  TOKEN=sessionStorage.getItem("factory-token");
  if(!TOKEN){try{TOKEN=localStorage.getItem("factory-token")}catch(e){}}
}catch(e){}
const dropToken=()=>{TOKEN=null;try{sessionStorage.removeItem("factory-token")}catch(e){}try{localStorage.removeItem("factory-token")}catch(e){}};
const canQueue=()=>SERVER&&!!TOKEN;
const jsonOf=async p=>{try{const r=await fetch(p+"?"+Date.now());return r.ok?await r.json():null}catch(e){return null}};
const recOf=q=>(q.options||[]).find(o=>o.recommended);
function planOf(e){
  const qs=e.questions||[]; if(!qs.length) return null;
  const sel=UI.sel[e.job]||{}, thens=[];
  for(const q of qs){const o=(q.options||[]).find(o=>o.key===sel[q.id]); if(!o) return null; thens.push(o.then||"rework")}
  return thens.includes("rework")?"rework":"approve";   /* rework wins when answers disagree */
}
function composeNote(e){
  const sel=UI.sel[e.job]||{}, parts=[];
  (e.questions||[]).forEach(q=>{const o=(q.options||[]).find(o=>o.key===sel[q.id]); if(o) parts.push(`Q${q.id} ${q.text} -> ${o.key}) ${o.label}`)});
  const n=(UI.note[e.job]||"").trim(); if(n) parts.push(n);
  return parts.join(" | ").replace(/\s+/g," ");
}
function commandFor(e,type){
  if(type==="resume") return `${CMD} run resume`;
  if(type==="approve") return `${CMD} approve ${e.job}`;
  if(type==="signoff") return `${CMD} signoff ${e.job}${UI.note[e.job]?" "+UI.note[e.job]:""}`;
  return `${CMD} rework ${e.job} ${composeNote(e)}`;
}
const LABEL={approve:"Approve and merge",rework:"Send back to the builder",resume:"Resume run",signoff:"Sign off now"};
function entryHtml(e){
  const job=e.job, d=esc(job), sel=UI.sel[job]||{};
  const pend=PENDING.filter(a=>a.job===job).pop(), v=VERIFY[job];
  let h=`<div class="entry"><div class="eh"><b>${d}</b> <span class="badge warn">${esc(e.reason||"")}</span>`
    +(v?` <span class="chip ${/PASS/.test(v)?"PASS":"CHANGES"}">${esc(v)}</span>`:"")
    +(e.blocks&&e.blocks.length?` <span class="dep">blocks ${esc(e.blocks.join(", "))}</span>`:"")+`</div>`;
  if(e.why) h+=`<p class="why">${esc(e.why)}</p>`;
  if(e.reason==="SIGN-OFF") h+=`<p class="why">The job keeps running while you decide. Signing off records your decision; it still needs review, tests and the approver before it merges.</p>`;
  if(e.conflicts&&e.conflicts.length) h+=`<p class="why"><b>Conflicts with the default branch</b> in ${esc(e.conflicts.join(", "))}. Approving records your decision and sends the job back to merge the default branch in first, then it is reviewed again.</p>`;
  if(pend){
    return h+`<div class="queued">Queued <b>${esc(pend.type)}</b> (${esc(pend.at)}). Now run <code>${CMD} apply</code> in your Claude session. <button data-act="copytext" data-text="${esc(CMD+" apply")}">Copy command</button></div></div>`;
  }
  const qs=e.questions||[];
  qs.forEach(q=>{
    h+=`<div class="q"><div class="qt">${esc(q.id)}. ${esc(q.text)}</div><div class="opts">`
      +(q.options||[]).map(o=>`<button class="opt${o.recommended?" rec":""}${sel[q.id]===o.key?" sel":""}" data-act="pick" data-job="${d}" data-q="${esc(q.id)}" data-k="${esc(o.key)}">${esc(o.key)}) ${esc(o.label)}${o.recommended?' <span class="tag">recommended</span>':""}</button>`).join("")
      +`</div></div>`;
  });
  h+=`<textarea data-note="${d}" rows="2" placeholder="Optional note (needed for rework when no option is picked)">${esc(UI.note[job]||"")}</textarea><div class="acts">`;
  const plan=planOf(e);
  if(qs.length&&qs.every(recOf)) h+=`<button data-act="rec" data-job="${d}">Use recommendations</button>`;
  if(qs.length) h+=`<button class="prim" data-act="submit" data-job="${d}" data-type="${plan||""}" ${plan?"":"disabled"}>${plan?esc(LABEL[plan]):"Pick an option for every question"}</button>`;
  (e.actions||[]).forEach(a=>{ if(LABEL[a.type]&&a.type!=="resume") h+=`<button class="${a.recommended?"prim":""}" data-act="submit" data-job="${d}" data-type="${esc(a.type)}">${esc(a.label||LABEL[a.type])}${a.recommended?' <span class="tag">recommended</span>':""}</button>`});
  h+=`</div>`;
  if(UI.confirm[job]) h+=`<div class="confirm">This merges <b>${d}</b> into the default branch. ${v?`Verification: <b>${esc(v)}</b>. `:""}The orchestrator re-runs the tests before merging. <button class="prim" data-act="go" data-job="${d}" data-type="approve">Confirm: queue merge</button> <button data-act="cancel" data-job="${d}">Cancel</button></div>`;
  if(UI.msg[job]) h+=`<div class="msg">${esc(UI.msg[job])}</div>`;
  if(UI.cmd[job]) h+=`<input class="cmd" readonly value="${esc(UI.cmd[job])}" onclick="this.select()">`;
  return h+`</div>`;
}
function renderInbox(){
  const parked=JOBS.filter(j=>j.stage==="needs-human");
  let body="";
  if(ENTRIES&&ENTRIES.length) body=ENTRIES.map(entryHtml).join("");
  else{
    const sections=MD.split(/^## /m).slice(1).map(s=>{const i=s.indexOf("\n");return{h:s.slice(0,i).trim(),body:s.slice(i+1).trim()}});
    body=sections.length
      ? sections.map(s=>`<details open><summary>${esc(s.h)}</summary><div class="md">${mdToHtml(s.body)}</div></details>`).join("")
      : parked.map(j=>`<details><summary>${esc(j.id)} ${esc(j.title||"")}</summary><pre>${esc(j.parked_reason||"See decision.md or spec.md Open decisions.")}</pre></details>`).join("");
  }
  const log=APPLIED.slice(-8).reverse().map(a=>`<div class="item"><span class="pill ${a.result==="applied"?"done":a.result==="rejected"?"blocked":"parked"}">${esc(a.result)}</span><span class="t">${esc(a.type)} ${esc(a.job||"")} <span class="dep">${esc(a.detail||"")}</span></span></div>`).join("");
  if(!body&&!log){$("inbox").innerHTML="";return}
  const n=(ENTRIES&&ENTRIES.length)||parked.length;
  const mode=canQueue()?`Clicking queues the action; it runs when you enter <code>${CMD} apply</code>.`
    :SERVER?`<b>Read-only: this page has no token.</b> The server is running, but this tab was opened without the <code>#t=...</code> part of the URL it printed (or the server restarted and issued a new token). Open the full URL from the server's terminal output in this tab. Until then, buttons copy the command instead.`
    :`Read-only: start <code>python3 factory/server.py</code> and open the URL it prints to queue actions from here. Buttons copy the command instead.`;
  $("inbox").innerHTML=(body?`<div class="panel alert"><h2 class="sec">Needs you (${n})</h2>${body}<div class="empty" style="margin-top:6px">${mode}</div></div>`:"")
    +(log?`<details class="panel"><summary>Recent actions (${APPLIED.length})</summary>${log}</details>`:"");
}
function runExtras(run){
  let h="";
  if(PENDING.length) h+=`<div class="reason"><b>${PENDING.length} queued action${PENDING.length>1?"s":""}</b> waiting. Run <code>${CMD} apply</code> in your Claude session. <button data-act="copytext" data-text="${esc(CMD+" apply")}">Copy command</button></div>`;
  if(run&&run.status==="stopped"&&!PENDING.some(a=>a.type==="resume")){
    /* Resuming only helps when some backlog item can start; otherwise say what is in the way. */
    const ready=ITEMS.filter(i=>i.status==="ready").length, parked=JOBS.filter(j=>j.stage==="needs-human").length;
    if(ready) h+=`<div class="reason"><button class="prim" data-act="resume">${canQueue()?"Queue: resume run":"Copy: resume command"}</button></div>`;
    else if(parked) h+=`<div class="reason empty">Nothing can run yet: every remaining item is waiting on a parked job. Answer the ${parked>1?"entries":"entry"} under <b>Needs you</b> first; resuming now would stop again.</div>`;
  }
  return h;
}
async function copyText(key,text){
  UI.cmd[key]=text;
  try{await navigator.clipboard.writeText(text);UI.msg[key]="Copied. Paste it into your Claude session."}
  catch(e){UI.msg[key]="Select and copy the command below."}
  paint(true);
}
async function queue(body,key){
  try{
    const r=await fetch("api/action",{method:"POST",headers:{"Content-Type":"application/json","X-Factory-Token":TOKEN},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(r.status===403){dropToken();UI.msg[key]="Not queued: the server rejected the token (it restarted, or this URL is stale). Open the full URL it printed, including #t=..."}
    else UI.msg[key]=r.status===201?"Queued.":"Not queued: "+(j.error||r.status);
  }catch(e){UI.msg[key]="Not queued: the server is unreachable."}
  UI.confirm[key]=false; await load(true);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  const act=b.dataset.act, job=b.dataset.job, e=job&&(ENTRIES||[]).find(x=>x.job===job);
  if(act==="copytext") return copyText("run",b.dataset.text);
  if(act==="resume"){return canQueue()?queue({type:"resume",job:null},"run"):copyText("run",`${CMD} run resume`)}
  if(!e) return;
  if(act==="pick"){(UI.sel[job]=UI.sel[job]||{})[b.dataset.q]=b.dataset.k;UI.confirm[job]=false;UI.msg[job]="";return paint(true)}
  if(act==="rec"){UI.sel[job]=UI.sel[job]||{};(e.questions||[]).forEach(q=>{const r=recOf(q);if(r)UI.sel[job][q.id]=r.key});return paint(true)}
  if(act==="cancel"){UI.confirm[job]=false;return paint(true)}
  if(act==="submit"||act==="go"){
    const type=b.dataset.type; if(!type) return;
    if(type==="rework"&&!composeNote(e)){UI.msg[job]="Rework needs a note or an answer.";return paint(true)}
    if(!canQueue()) return copyText(job,commandFor(e,type));
    if(type==="approve"&&act==="submit"){UI.confirm[job]=true;return paint(true)}
    return queue({type,job,answers:UI.sel[job]||{},note:UI.note[job]||""},job);
  }
});
document.addEventListener("input",ev=>{const j=ev.target.dataset&&ev.target.dataset.note; if(j) UI.note[j]=ev.target.value});
function paint(force){
  renderRun(BOARD,ITEMS,JOBS);renderBacklog(ITEMS);renderEpics(ITEMS);renderContexts(ITEMS,JOBS);render(JOBS);
  const sig=JSON.stringify([ENTRIES,MD,PENDING,APPLIED,SERVER,!!TOKEN,VERIFY,JOBS.map(j=>j.stage)]);
  if(force||sig!==lastSig){lastSig=sig;renderInbox()}
}

function renderBacklog(items){
  if(!items.length){$("backlog").innerHTML='<div class="empty">—</div>';return}
  $("backlog").innerHTML=items.map(i=>`<div class="item"><span class="pill ${i.status}">${i.status}</span>
    <span class="t">${esc(i.key)} ${esc(i.title)}${i.epic?` <span class="badge">${esc(i.epic)}</span>`:""}${i.ctx?` <span class="badge">${esc(i.ctx)}</span>`:""}${i.open&&i.open.length?` <span class="dep">needs ${esc(i.open.join(", "))}</span>`:""}</span></div>`).join("");
}
function renderEpics(items){
  const eps={}; items.forEach(i=>{if(!i.epic)return;(eps[i.epic]=eps[i.epic]||{n:0,d:0});eps[i.epic].n++;if(i.status==="done")eps[i.epic].d++});
  const ks=Object.keys(eps).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  $("epics").innerHTML=ks.length?ks.map(k=>`<div class="ep"><span>${k}</span><div class="track"><i class="d" style="width:${100*eps[k].d/eps[k].n}%"></i></div><span>${eps[k].d}/${eps[k].n}</span></div>`).join(""):'<div class="empty">No [E&lt;n&gt;] tags in the backlog.</div>';
}
/* Contexts panel: only when the backlog has [ctx:<id>] tags (a project with a domain model). */
function renderContexts(items,jobs){
  const cs={}; items.forEach(i=>{if(!i.ctx)return;const c=(cs[i.ctx]=cs[i.ctx]||{n:0,d:0,a:0});c.n++;if(i.status==="done")c.d++;else if(i.status==="active"||i.status==="parked")c.a++});
  const ks=Object.keys(cs).sort((a,b)=>a.localeCompare(b));
  $("ctxwrap").style.display=ks.length?"":"none";
  $("ctxs").innerHTML=ks.map(k=>`<div class="ep"><span style="width:90px;overflow:hidden;text-overflow:ellipsis" title="${esc(k)}">${esc(k)}</span><div class="track"><i class="d" style="width:${100*cs[k].d/cs[k].n}%"></i></div><span>${cs[k].d}/${cs[k].n}${cs[k].a?` · ${cs[k].a} active`:""}</span></div>`).join("");
}
async function load(force){
  try{
    const [b,bl,ib,inj,acts,app,ping]=await Promise.all([
      fetch("board.json?"+Date.now()).then(r=>r.json()),txt("backlog.md"),txt("inbox.md"),
      jsonOf("inbox.json"),txt("actions.jsonl"),jsonOf("actions-applied.json"),
      fetch("api/ping").then(r=>r.ok).catch(()=>false)]);
    BOARD=b;JOBS=b.jobs||[];ITEMS=classify(parseBacklog(bl),JOBS);MD=ib;SERVER=ping;
    ENTRIES=inj&&Array.isArray(inj.entries)?inj.entries:null;
    APPLIED=(app&&Array.isArray(app.applied))?app.applied:[];
    const done=new Set(APPLIED.map(a=>a.id));
    PENDING=acts.split("\n").map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(a=>a&&a.id&&!done.has(a.id));
    for(const e of ENTRIES||[]){const t=await txt(`jobs/${e.job}/verify.md`);VERIFY[e.job]=(t.split("\n")[0]||"").trim()}
    paint(force);
    $("meta").textContent="Updated "+new Date().toLocaleTimeString()+" · "+JOBS.length+" jobs · "+(canQueue()?"interactive":SERVER?"server running: open the URL it printed to act":"read-only");
  }catch(e){$("meta").textContent="Cannot load board.json (run python3 server.py inside factory/)"}
}
function render(jobs){
  $("board").innerHTML=STAGES.map(s=>{
    const cards=jobs.filter(j=>j.stage===s).map(card).join("")||'<div class="empty">—</div>';
    return `<section class="col"><h2>${s}</h2>${cards}</section>`;
  }).join("");
}
function card(j){
  const rounds=Object.entries(j.reviews||{}).map(([n,r])=>
    `<div class="round">Round ${esc(n)}: ${REV.filter(k=>k in r).map(k=>`<span class="chip ${esc(r[k]||"")}">${k}: ${esc(r[k]||"pending")}</span>`).join("")}${r.triage?`<span class="chip">triage: ${esc(r.triage)}</span>`:""}</div>`).join("");
  return `<div class="card ${j.stage==="needs-human"?"nh":""}" onclick='openJob(${JSON.stringify(j.id)})'>
    <b>${esc(j.id)}</b>${esc(j.title||"")}<div><span class="badge">${esc(j.track||"?")}</span> ${j.decision?`<span class="badge">${esc(j.decision)}</span>`:""}
    ${j.item?`<span class="badge">${esc(j.item)}</span>`:""}${(j.contexts||[]).map(c=>` <span class="badge">${esc(c)}</span>`).join("")}${j.assumptions?`<span class="badge warn">${esc(j.assumptions)} assumption${j.assumptions>1?"s":""}</span>`:""}${(j.execution||{}).blocked?`<span class="badge warn">blocked</span>`:""}</div>${j.parked_reason?`<div class="round">${esc(j.parked_reason)}</div>`:""}${rounds}</div>`;
}
/* Markdown for the file viewer. Agent-written text is untrusted and this page holds a token that can queue merges,
   so nothing is passed through as HTML: every piece of text is escaped first, and only the constructs below are
   turned back into tags. Links are kept only for http(s) and relative targets. */
const SAFE_URL=u=>/^(https?:\/\/|\.{0,2}\/|#)/i.test(u)||!/^[a-z][a-z0-9+.-]*:/i.test(u);
function mdInline(s){
  const keep=[];const put=h=>"\u0000"+(keep.push(h)-1)+"\u0000";
  s=s.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g,(m,t,c)=>put(`<code>${esc(c.trim())}</code>`));
  s=s.replace(/\[([^\]\n]+)\]\(([^()\s]+)\)/g,(m,t,u)=>SAFE_URL(u)?put(`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`):m);
  s=esc(s);
  s=s.replace(/\*\*([^*\n]+?)\*\*/g,"<strong>$1</strong>").replace(/__([^_\n]+?)__/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^\w*])\*(?![\s*])([^*\n]+?)\*(?![\w*])/g,"$1<em>$2</em>").replace(/(^|[^\w])_(?![\s_])([^_\n]+?)_(?!\w)/g,"$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>keep[+i]);
}
function mdToHtml(src){
  const L=src.replace(/\r\n?/g,"\n").split("\n");const out=[];let i=0;
  const isTableSep=l=>/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
  const cells=l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split(/(?<!\\)\|/).map(c=>mdInline(c.trim().replace(/\\\|/g,"|")));
  const LIST=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const blockStart=l=>/^\s*(#{1,6}\s|```|~~~|>|(-{3,}|\*{3,}|_{3,})\s*$)/.test(l)||LIST.test(l)||/^\s*\|/.test(l);
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    let m=l.match(/^\s*(```|~~~)/);
    if(m){const fence=m[1],buf=[];i++;while(i<L.length&&!L[i].trim().startsWith(fence))buf.push(L[i++]);i++;out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);continue}
    if((m=l.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/))){const n=Math.min(m[1].length+1,4);out.push(`<h${n}>${mdInline(m[2])}</h${n}>`);i++;continue}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\s*\|/.test(l)&&i+1<L.length&&isTableSep(L[i+1])){
      const head=cells(l);i+=2;const rows=[];
      while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(cells(L[i++]));
      out.push(`<div class="tw"><table><thead><tr>${head.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue}
    if(/^\s*>/.test(l)){const buf=[];while(i<L.length&&/^\s*>/.test(L[i]))buf.push(L[i++].replace(/^\s*>\s?/,""));out.push(`<blockquote>${mdToHtml(buf.join("\n"))}</blockquote>`);continue}
    if(LIST.test(l)){
      /* nested lists by indentation; a non-marker line indented under an item continues it */
      const stack=[];let html="";
      const open=(ind,ord)=>{stack.push({ind,ord});html+=ord?"<ol>":"<ul>"};
      const close=()=>{const s=stack.pop();html+="</li>"+(s.ord?"</ol>":"</ul>")};
      while(i<L.length){
        const x=L[i];const lm=x.match(LIST);
        if(lm){
          const ind=lm[1].replace(/\t/g,"    ").length,ord=/\d/.test(lm[2]);
          while(stack.length&&ind<stack[stack.length-1].ind)close();
          if(stack.length&&ind===stack[stack.length-1].ind&&ord!==stack[stack.length-1].ord)close();
          if(!stack.length||ind>stack[stack.length-1].ind)open(ind,ord);else html+="</li>";
          let body=lm[3],cls="";const t=body.match(/^\[([ xX])\]\s+(.*)$/);
          if(t){cls=' class="task"';body=(t[1]===" "?"☐ ":"☑ ")+t[2]}
          html+=`<li${cls}>${mdInline(body)}`;i++;
        }else if(x.trim()&&/^\s+/.test(x)&&!blockStart(x)){html+=" "+mdInline(x.trim());i++}
        else break;
      }
      while(stack.length)close();
      out.push(html.replace(/^<\/li>/,""));continue}
    /* Factory specs list criteria as "AC1: ...", "A2: ...", "OD1: ..." lines: give each its own paragraph with the id in bold. */
    const ID=/^(AC|A|OD|R|N|F)\d+\b[^:\n]{0,60}:\s/;
    if(ID.test(l.trim())){const t=l.trim(),c=t.indexOf(":");i++;
      const more=[];while(i<L.length&&L[i].trim()&&!blockStart(L[i])&&!ID.test(L[i].trim()))more.push(L[i++].trim());
      out.push(`<p class="id"><strong>${mdInline(t.slice(0,c+1))}</strong>${mdInline(t.slice(c+1))}${more.map(x=>" "+mdInline(x)).join("")}</p>`);continue}
    const buf=[];
    while(i<L.length&&L[i].trim()&&!(buf.length&&(blockStart(L[i])||ID.test(L[i].trim()))))buf.push(L[i++].trim());
    out.push(`<p>${buf.map(mdInline).join("<br>")}</p>`);
  }
  return out.join("\n");
}
/* First line of factory files is a machine-readable verdict; show it as a coloured badge. */
function verdictBadge(first){
  const v=first.trim();
  if(!/^(VERDICT:|TRIAGE:|VERIFY:|APPROVE|ESCALATE)/.test(v))return null;
  const k=/PASS|CLEAN|^APPROVE/.test(v)?"ok":/CHANGES|FAIL|ESCALATE/.test(v)?"bad":"warn";
  return `<span class="verdict ${k}">${esc(v)}</span>`;
}
function diffHtml(t){
  return `<div class="diff">${t.split("\n").map(l=>{
    const c=/^(diff --git|index |--- |\+\+\+ )/.test(l)?(l.startsWith("diff")?"f":"h"):l.startsWith("@@")?"h":l.startsWith("+")?"a":l.startsWith("-")?"r":"";
    return `<span${c?` class="${c}"`:""}>${esc(l)||" "}</span>`}).join("")}</div>`;
}
let VIEW={id:null,f:null,text:"",raw:false};
function renderView(){
  if(VIEW.f==="status")return;
  const {f,text,raw}=VIEW;
  $("fname").textContent=f||"";
  $("rawbtn").textContent=raw?"Show formatted":"Show source";
  $("rawbtn").style.display=text?"":"none";
  if(!text){$("content").innerHTML=`<div class="empty">${esc(VIEW.msg||"(not written yet)")}</div>`;return}
  if(raw){$("content").innerHTML=`<pre>${esc(text)}</pre>`;return}
  if(/\.diff$/.test(f)){$("content").innerHTML=diffHtml(text);return}
  const nl=text.indexOf("\n"),first=nl<0?text:text.slice(0,nl),badge=verdictBadge(first);
  $("content").innerHTML=`<div class="md">${badge?badge+mdToHtml(nl<0?"":text.slice(nl+1)):mdToHtml(text)}</div>`;
}
function toggleRaw(){VIEW.raw=!VIEW.raw;renderView()}
async function openJob(id){
  const b=await (await fetch("board.json?"+Date.now())).json();
  const j=b.jobs.find(x=>x.id===id);
  $("tabs").innerHTML=`<button data-f="status" onclick='showStatus(${JSON.stringify(id)})'>status</button>`+
    FILES(j).map(f=>`<button data-f="${esc(f)}" onclick='showFile(${JSON.stringify(id)},${JSON.stringify(f)})'>${esc(f)}</button>`).join("");
  $("viewer").style.display="block";
  showStatus(id);
}
const short=v=>v?esc(String(v).slice(0,10)):"—";
async function showStatus(id){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.f==="status"));
  VIEW={id,f:"status",text:"",raw:false,msg:""};$("fname").textContent=`${id} · status`;
  const b=await (await fetch("board.json?"+Date.now())).json();const j=b.jobs.find(x=>x.id===id)||{};
  const ws=j.workspace||{},ex=j.execution||{},ev=j.evidence||{};
  const rows=[["Stage",esc(j.stage)+(j.parked_reason?` — ${esc(j.parked_reason)}`:"")],["Round",esc(j.round)],["Attempt",esc(ex.attempt??"—")],
    ["Branch",`<code>${esc(j.branch||"")}</code>`],
    ["Worktree",ws.kind==="worktree"?(ws.path?`<code>${esc(ws.path)}</code>`:"removed after the job finished"):"the project checkout (before 2.2.0)"],
    ["Base commit",short(ws.base_commit)],
    ["Verified",ev.verified_commit?`${short(ev.verified_commit)} (${esc(ev.tested||"branch")}, ${esc(ev.verified_at||"")})`:(ev.head_commit?`not passing (last tried ${short(ev.head_commit)})`:"not yet")]];
  if(ex.blocked)rows.push(["Blocked",`<b>${esc(ex.blocked)}</b>`]);
  if(ex.last_error&&ex.last_error!==ex.blocked)rows.push(["Last error",esc(ex.last_error)]);
  let evs=[];
  try{const t=await (await fetch("events.jsonl?"+Date.now())).text();
    for(const line of t.split("\n")){if(!line.trim())continue;try{const e=JSON.parse(line);if(e.job===id)evs.push(e)}catch(_){}}}catch(_){}
  const what=e=>e.kind==="transition"?`${esc(e.from)} → ${esc(e.to)}`:e.kind==="verify"?`verify ${esc(e.result)} ${short(e.commit)}`
    :e.kind==="scope"?`scope ${esc(e.role)}: ${esc(e.result)}`:e.kind==="worktree"?`worktree ${esc(e.action)}`:esc(e.kind);
  const log=evs.slice(-20).reverse().map(e=>`<tr><td>${esc((e.at||"").replace("T"," ").replace("+00:00"," UTC"))}</td><td>${what(e)}</td><td>${esc(e.actor==="human"?"human":"")}</td><td>${esc(e.reason||(e.problems||[]).join("; "))}</td></tr>`).join("");
  $("content").innerHTML=`<dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`+
    (log?`<h3>History (latest first)</h3><table class="ev">${log}</table>`:`<div class="empty">No events recorded for this job yet.</div>`);
}
async function showFile(id,f){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.f===f));
  VIEW={id,f,text:"",raw:VIEW.raw,msg:""};
  try{const r=await fetch(`jobs/${id}/${f}?`+Date.now());if(r.ok)VIEW.text=await r.text();else VIEW.msg="(not written yet)"}
  catch(e){VIEW.msg="(unavailable)"}
  renderView();
}
function renderHealth(){
  if(!SERVER){$("health").innerHTML=`<div class="empty">Run <code>/software-factory:factory doctor</code> in Claude Code (or <code>python3 factory/factoryctl.py doctor</code>) for a health check. With <code>python3 factory/server.py</code> running, it can run from here.</div>`;return}
  if(!$("health").dataset.ready){$("health").innerHTML=`<button onclick="runDoctor()">Run health check</button> <span class="empty">Read-only: checks the board, config, branches, worktrees, inbox and queued clicks.</span><div id="doctor"></div>`;$("health").dataset.ready="1"}
}
async function runDoctor(){
  $("doctor").innerHTML=`<div class="empty">Checking…</div>`;
  try{const r=await fetch("api/doctor");const d=await r.json();
    $("doctor").innerHTML=`<div class="${d.ok?"":"chg"}">${d.ok?"No failures.":"Something needs fixing."}${d.cached?" (result from the last few seconds)":""}</div><pre class="out">${esc(d.output||d.error||"")}</pre>`}
  catch(e){$("doctor").innerHTML=`<div class="empty">The health check is unavailable (${esc(e.message)}).</div>`}
}
load();setInterval(()=>{load(false);renderHealth()},3000);setTimeout(renderHealth,300);
